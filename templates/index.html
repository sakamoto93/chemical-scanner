<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chemical Scanner</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Chemical Scanner</h1>
        <div class="camera-container">
            <!-- MacBook: displays OpenCV video stream via /video_feed -->
            <img id="camera" src="/video_feed" alt="Camera Feed" style="display:none;">
            <!-- iPhone/Mobile: displays video from getUserMedia (rear camera) -->
            <video id="video-stream" playsinline autoplay muted style="display:none; width: 100%; height: auto; background: #000;"></video>
            <canvas id="canvas" style="display:none;"></canvas>
            <p id="camera-status" style="text-align: center; color: #666; padding: 10px;">カメラ初期化中...</p>
            <!-- Debug info panel -->
            <div id="debug-panel" style="background: #f5f5f5; border: 1px solid #ddd; border-radius: 4px; padding: 10px; margin-top: 10px; font-size: 12px; font-family: monospace; max-height: 150px; overflow-y: auto; display: none;">
                <p style="margin: 0; padding: 5px; background: white; border-radius: 2px;">
                    <strong>デバッグ情報:</strong><br>
                    <span id="debug-output"></span>
                </p>
            </div>
        </div>
        <div class="controls">
            <button id="capture-btn">自動スキャン: 開始</button>
            <span id="status"></span>
        </div>
        <div class="settings">
            <h3>スキャン設定</h3>
            <div class="setting-group">
                <label for="startup-delay">スタートアップ遅延（秒）:</label>
                <input type="number" id="startup-delay" value="5" min="1" max="60" step="0.5">
            </div>
            <div class="setting-group">
                <label for="scan-interval">スキャン間隔（秒）:</label>
                <input type="number" id="scan-interval" value="8.0" min="0.5" max="30" step="0.5">
            </div>
        </div>
        <div class="results">
            <h2>OCR結果</h2>
            <div id="ocr-results"></div>
            <div id="add-to-list-container" style="display:none; margin-top: 15px;">
                <button id="add-to-list-btn">リストに追加</button>
            </div>
        </div>
        <div class="compound-list">
            <h2>検出された試薬一覧</h2>
            <table id="compound-table">
                <thead>
                    <tr>
                        <th>CAS番号</th>
                        <th>化合物名</th>
                        <th>分子式</th>
                        <th>分子量</th>
                        <th style="background: #fff3e0;">リスク</th>
                        <th>削除</th>
                    </tr>
                </thead>
                <tbody id="compound-tbody">
                </tbody>
            </table>
            <p id="empty-message" style="text-align: center; color: #999; padding: 20px;">
                リストに試薬を追加してください
            </p>
            <div id="export-buttons" style="text-align: center; padding: 20px; display: none;">
                <button id="export-excel-btn" style="margin-right: 10px; padding: 10px 20px; background-color: #2196F3; color: white; border: none; border-radius: 4px; cursor: pointer;">Excelダウンロード</button>
                <button id="export-csv-btn" style="padding: 10px 20px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer;">CSVダウンロード</button>
            </div>
        </div>
    </div>
    <script>
        // Debug logging function - logs to both console and page
        const debugOutput = document.getElementById('debug-output');
        const debugPanel = document.getElementById('debug-panel');
        let debugLogs = [];

        function debugLog(message) {
            console.log(message);
            debugLogs.push(message);
            debugOutput.innerHTML = debugLogs.join('<br>');
            debugPanel.style.display = 'block';
        }

        // Platform detection and camera initialization
        const isMobile = /iPhone|iPad|Android|webOS|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const cameraImg = document.getElementById('camera');
        const videoStream = document.getElementById('video-stream');
        const cameraStatus = document.getElementById('camera-status');
        let localMediaStream = null;

        debugLog('[Platform Detection] Device is ' + (isMobile ? 'mobile' : 'desktop'));

        // Initialize camera based on platform
        async function initializeCamera() {
            debugLog('[Camera Init] Starting initialization...');
            if (isMobile) {
                // Mobile: use getUserMedia with rear camera
                debugLog('[Camera Init] Device is mobile - requesting rear camera');
                debugLog('[Camera Init] Checking navigator.mediaDevices: ' + (navigator.mediaDevices ? 'available' : 'NOT available'));
                try {
                    debugLog('[Camera Init] Calling getUserMedia...');
                    localMediaStream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: 'environment',  // rear camera
                            width: { ideal: 1280 },
                            height: { ideal: 720 }
                        },
                        audio: false
                    });
                    debugLog('[Camera Init] getUserMedia succeeded - stream obtained');
                    videoStream.srcObject = localMediaStream;
                    debugLog('[Camera Init] Stream assigned to video element');
                    videoStream.style.display = 'block';
                    debugLog('[Camera Init] Video element made visible');
                    cameraStatus.textContent = 'カメラ: リアカメラ (mobile)';
                    debugLog('[Camera Init] Mobile camera initialized successfully ✓');
                } catch (error) {
                    debugLog('[Camera Init] ERROR: ' + error.name + ' - ' + error.message);
                    console.error('[Camera Init] Full error:', error);
                    cameraStatus.textContent = 'エラー: カメラが使用できません (' + error.message + ')';
                }
            } else {
                // Desktop: use OpenCV video stream from MacBook
                debugLog('[Camera Init] Device is desktop - using /video_feed');
                cameraImg.style.display = 'block';
                cameraStatus.textContent = 'カメラ: MacBook (desktop)';
                debugLog('[Camera Init] Desktop camera initialized ✓');
            }
        }

        // Capture frame for OCR (supports both mobile and desktop)
        async function captureFrameForOCR() {
            if (isMobile) {
                // Mobile: capture from video stream using canvas
                debugLog('[captureFrameForOCR] Mobile: checking video stream...');
                if (!videoStream || !videoStream.videoWidth || !videoStream.videoHeight) {
                    debugLog('[captureFrameForOCR] ERROR: Video not ready - videoWidth=' + (videoStream ? videoStream.videoWidth : 'N/A') + ', videoHeight=' + (videoStream ? videoStream.videoHeight : 'N/A'));
                    return null;
                }
                debugLog('[captureFrameForOCR] Mobile: video ready ' + videoStream.videoWidth + 'x' + videoStream.videoHeight);
                const canvas = document.getElementById('canvas');
                canvas.width = videoStream.videoWidth;
                canvas.height = videoStream.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(videoStream, 0, 0);
                debugLog('[captureFrameForOCR] Mobile: canvas frame drawn');
                return new Promise(resolve => {
                    canvas.toBlob(blob => {
                        if (blob) {
                            debugLog('[captureFrameForOCR] Mobile frame captured, size: ' + blob.size + ' bytes');
                        } else {
                            debugLog('[captureFrameForOCR] ERROR: blob is null');
                        }
                        resolve(blob);
                    }, 'image/jpeg', 0.9);
                });
            } else {
                // Desktop: use /capture endpoint from MacBook
                debugLog('[captureFrameForOCR] Desktop: fetching frame from /capture');
                try {
                    const response = await fetch('/capture');
                    if (!response.ok) {
                        throw new Error(`Capture failed with status ${response.status}`);
                    }
                    const blob = await response.blob();
                    debugLog('[captureFrameForOCR] Desktop frame captured, size: ' + blob.size + ' bytes');
                    return blob;
                } catch (error) {
                    debugLog('[captureFrameForOCR] Desktop error: ' + error.message);
                    return null;
                }
            }
        }

        // Initialize camera with multiple event listeners for reliability
        debugLog('[Init] Setting up camera initialization...');

        let initCalled = false;
        function callInitializeCamera() {
            if (!initCalled) {
                initCalled = true;
                debugLog('[Init] Calling initializeCamera()');
                initializeCamera();
            }
        }

        // Try DOMContentLoaded first
        if (document.readyState === 'loading') {
            debugLog('[Init] Document still loading - waiting for DOMContentLoaded');
            document.addEventListener('DOMContentLoaded', () => {
                debugLog('[Init] DOMContentLoaded fired');
                callInitializeCamera();
            });
        } else {
            // Document already loaded, use setTimeout for safety
            debugLog('[Init] Document already loaded - scheduling initialization with setTimeout');
            setTimeout(callInitializeCamera, 100);
        }

        const captureBtn = document.getElementById('capture-btn');
        const statusEl = document.getElementById('status');
        const ocrResults = document.getElementById('ocr-results');
        const startupDelayInput = document.getElementById('startup-delay');
        const scanIntervalInput = document.getElementById('scan-interval');
        const addToListBtn = document.getElementById('add-to-list-btn');
        const addToListContainer = document.getElementById('add-to-list-container');
        const compoundTbody = document.getElementById('compound-tbody');
        const emptyMessage = document.getElementById('empty-message');
        const exportButtons = document.getElementById('export-buttons');
        const exportExcelBtn = document.getElementById('export-excel-btn');
        const exportCsvBtn = document.getElementById('export-csv-btn');

        let isRunning = false;
        let intervalId = null;
        let countdownInterval = null;
        let previousTexts = [];
        let shouldStop = false;
        let startupDelay = 5;
        let scanInterval = 8.0;  // デフォルト8秒（OCR処理時間5-6秒 + バッファ）
        let currentCompoundInfo = null;
        let compoundList = [];
        let isOCRProcessing = false;  // OCR処理中フラグ（同時実行防止）
        let scanGeneration = 0;  // 開始/停止のたびに増加。古い世代のOCR結果を破棄するために使用

        // 設定変更時のイベントリスナー
        startupDelayInput.addEventListener('change', () => {
            startupDelay = parseFloat(startupDelayInput.value);
        });

        scanIntervalInput.addEventListener('change', () => {
            scanInterval = parseFloat(scanIntervalInput.value);
        });

        // リスト追加ボタンのイベントリスナー
        addToListBtn.addEventListener('click', addToList);

        // エクスポートボタンのイベントリスナー
        exportExcelBtn.addEventListener('click', () => exportList('excel'));
        exportCsvBtn.addEventListener('click', () => exportList('csv'));

        // テキスト配列をJSON文字列に変換（比較用）
        function textsToString(texts) {
            return JSON.stringify(texts.map(item => item.text));
        }

        // リストにアイテムを追加
        function addToList() {
            if (!currentCompoundInfo) {
                alert('追加する化合物情報がありません');
                return;
            }

            const item = {
                cas: currentCompoundInfo.cas || 'N/A',
                name: currentCompoundInfo.name,
                commonName: currentCompoundInfo.commonName || '',
                formula: currentCompoundInfo.formula,
                weight: currentCompoundInfo.weight,
                riskAssessment: currentCompoundInfo.riskAssessment || null
            };

            compoundList.push(item);
            console.log('[addToList] Added item with riskAssessment:', item.riskAssessment);
            updateCompoundTable();

            // リスト追加後にOCR結果をクリアしてスムーズに次のスキャンに進む
            ocrResults.innerHTML = '<p>次の試薬を読み取り中...</p>';
            currentCompoundInfo = null;
            addToListContainer.style.display = 'none';
            previousTexts = [];
            shouldStop = false;  // 次のスキャン開始のため shouldStop をリセット
            console.log('[addToList] State reset: previousTexts cleared, shouldStop=false');
        }

        // テーブルを更新（差分更新による高速化）
        function updateCompoundTable() {
            if (compoundList.length === 0) {
                compoundTbody.innerHTML = '';
                emptyMessage.style.display = 'block';
                exportButtons.style.display = 'none';
            } else {
                emptyMessage.style.display = 'none';
                exportButtons.style.display = 'block';
                // 現在の行数と比較して、不足分のみ追加
                const currentRows = compoundTbody.querySelectorAll('tr').length;
                const itemsToAdd = compoundList.slice(currentRows);

                if (currentRows === 0) {
                    // 最初の追加時は全行作成
                    itemsToAdd.forEach((item, index) => {
                        const row = document.createElement('tr');
                        const displayName = item.commonName ? `${item.name}<br/><small>(${item.commonName})</small>` : item.name;
                        const riskBadge = item.riskAssessment && item.riskAssessment.is_risk_target ?
                            '<span style="background: #d32f2f; color: white; padding: 4px 8px; border-radius: 3px; font-size: 0.85em; font-weight: bold;">⚠️ 対象</span>' :
                            '-';
                        row.innerHTML = `
                            <td>${item.cas}</td>
                            <td>${displayName}</td>
                            <td>${item.formula}</td>
                            <td>${item.weight}</td>
                            <td style="text-align: center;">${riskBadge}</td>
                            <td><button class="delete-btn" onclick="deleteFromList(${index})">削除</button></td>
                        `;
                        compoundTbody.appendChild(row);
                    });
                } else {
                    // 新しい行のみ追加（差分更新）
                    itemsToAdd.forEach((item, offset) => {
                        const index = currentRows + offset;
                        const row = document.createElement('tr');
                        const displayName = item.commonName ? `${item.name}<br/><small>(${item.commonName})</small>` : item.name;
                        const riskBadge = item.riskAssessment && item.riskAssessment.is_risk_target ?
                            '<span style="background: #d32f2f; color: white; padding: 4px 8px; border-radius: 3px; font-size: 0.85em; font-weight: bold;">⚠️ 対象</span>' :
                            '-';
                        row.innerHTML = `
                            <td>${item.cas}</td>
                            <td>${displayName}</td>
                            <td>${item.formula}</td>
                            <td>${item.weight}</td>
                            <td style="text-align: center;">${riskBadge}</td>
                            <td><button class="delete-btn" onclick="deleteFromList(${index})">削除</button></td>
                        `;
                        compoundTbody.appendChild(row);
                    });
                }
            }
        }

        // リストから削除
        function deleteFromList(index) {
            compoundList.splice(index, 1);
            // 削除後は全行を再構築（インデックス正確性を保証）
            compoundTbody.innerHTML = '';
            if (compoundList.length === 0) {
                emptyMessage.style.display = 'block';
                exportButtons.style.display = 'none';
            } else {
                emptyMessage.style.display = 'none';
                exportButtons.style.display = 'block';
                compoundList.forEach((item, idx) => {
                    const row = document.createElement('tr');
                    const displayName = item.commonName ? `${item.name}<br/><small>(${item.commonName})</small>` : item.name;
                    const riskBadge = item.riskAssessment && item.riskAssessment.is_risk_target ?
                        '<span style="background: #d32f2f; color: white; padding: 4px 8px; border-radius: 3px; font-size: 0.85em; font-weight: bold;">⚠️ 対象</span>' :
                        '-';
                    row.innerHTML = `
                        <td>${item.cas}</td>
                        <td>${displayName}</td>
                        <td>${item.formula}</td>
                        <td>${item.weight}</td>
                        <td style="text-align: center;">${riskBadge}</td>
                        <td><button class="delete-btn" onclick="deleteFromList(${idx})">削除</button></td>
                    `;
                    compoundTbody.appendChild(row);
                });
            }
        }

        // リストをエクスポート
        async function exportList(format) {
            if (compoundList.length === 0) {
                alert('エクスポートする試薬データがありません');
                return;
            }

            try {
                // 現在のリストをサーバーに送信
                const response = await fetch(`/export/${format}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        compounds: compoundList.map(item => ({
                            cas: item.cas,
                            name: item.name,
                            commonName: item.commonName,
                            formula: item.formula,
                            weight: item.weight,
                            source: 'unknown',  // 各試薬の検出方法を記録していないため 'unknown'
                            riskAssessment: item.riskAssessment || null
                        }))
                    })
                });

                if (!response.ok) {
                    throw new Error(`Export failed with status ${response.status}`);
                }

                // ダウンロード
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;

                // ファイル名を取得（Content-Dispositionから）
                const contentDisposition = response.headers.get('content-disposition');
                let filename = format === 'excel' ? 'chemical_list.xlsx' : 'chemical_list.csv';
                if (contentDisposition) {
                    const filenameMatch = contentDisposition.match(/filename="?([^"]+)"?/);
                    if (filenameMatch) {
                        filename = filenameMatch[1];
                    }
                }

                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                window.URL.revokeObjectURL(url);

                console.log(`[Export] ${format.toUpperCase()} exported: ${filename}`);
            } catch (error) {
                console.error('[Export Error]', error);
                alert(`エクスポートに失敗しました: ${error.message}`);
            }
        }

        // OCR実行関数
        async function performOCR() {
            // このスキャンが属する世代を記録（停止・再開のたびに scanGeneration が変わる）
            const myGeneration = scanGeneration;

            // 停止フラグが立っている場合は実行しない
            if (shouldStop) {
                console.log('[performOCR] Skipped: shouldStop is true');
                return;
            }

            // OCR処理中は次のスキャンをスキップ（同時実行防止）
            if (isOCRProcessing) {
                console.log('[performOCR] Skipped: OCR processing already in progress');
                return;
            }

            isOCRProcessing = true;
            debugLog('[performOCR] Starting capture (device: ' + (isMobile ? 'mobile' : 'desktop') + ')');
            try {
                const captureStart = performance.now();
                const blob = await captureFrameForOCR();
                const captureEnd = performance.now();
                debugLog('[performOCR] Capture completed in ' + (captureEnd - captureStart).toFixed(2) + ' ms');

                if (!blob) {
                    throw new Error('Failed to capture frame from camera');
                }

                console.log('[performOCR] Blob received, size:', blob.size, 'bytes');

                const formData = new FormData();
                formData.append('file', blob, 'frame.jpg');

                console.log('[performOCR] Starting OCR request');
                const ocrStart = performance.now();
                const ocrResponse = await fetch('/ocr', {
                    method: 'POST',
                    body: formData
                });
                const ocrEnd = performance.now();
                console.log('[performOCR] OCR response received in', (ocrEnd - ocrStart).toFixed(2), 'ms, status:', ocrResponse.status);

                if (!ocrResponse.ok) {
                    throw new Error(`OCR failed with status ${ocrResponse.status}`);
                }

                const data = await ocrResponse.json();
                console.log('[performOCR] OCR data parsed, texts count:', data.texts ? data.texts.length : 0);
                console.log('[performOCR] CAS:', data.cas_number);
                console.log('[performOCR] Has compound_info:', !!data.compound_info);
                console.log('[performOCR] Has risk_assessment:', !!data.risk_assessment);
                if (data.risk_assessment) {
                    console.log('[performOCR] Risk Assessment Detail:', data.risk_assessment);
                } else {
                    console.log('[performOCR] ⚠️  NO risk_assessment in response');
                }

                // 停止中、または停止→再開により世代が変わった場合は古い結果を破棄
                if (shouldStop || myGeneration !== scanGeneration) {
                    console.log('[performOCR] Processing cancelled: shouldStop =', shouldStop, ', generation', myGeneration, 'vs current', scanGeneration);
                    return;
                }

                if (data.error) {
                    console.error('[performOCR] Server error:', data.error);
                    ocrResults.innerHTML = `<p class="error">エラー: ${data.error}</p>`;
                    previousTexts = [];
                } else {
                    // 現在のテキストと前フレームを比較
                    const currentTextsStr = textsToString(data.texts);
                    const previousTextsStr = textsToString(previousTexts);
                    console.log('[performOCR] Text comparison - current:', currentTextsStr.substring(0, 50), '... | previous:', previousTextsStr.substring(0, 50), '...');

                    // テキストが異なる場合のみ表示を更新
                    if (currentTextsStr !== previousTextsStr) {
                        console.log('[performOCR] New text detected, updating display');
                        let html = '';

                        // OCRで抽出したテキストを表示
                        data.texts.forEach(item => {
                            html += `<p><strong>${item.text}</strong> (信頼度: ${(item.confidence * 100).toFixed(1)}%)</p>`;
                        });

                        // リスク警告表示
                        if (data.risk_assessment && data.risk_assessment.is_risk_target) {
                            html += `<div style="background: #ffebee; border-left: 4px solid #d32f2f; padding: 15px; margin: 15px 0; border-radius: 4px;">`;
                            html += `<p style="color: #d32f2f; font-weight: bold; margin-top: 0;">⚠️ リスク対象化合物</p>`;
                            html += `<p style="margin: 8px 0; color: #c62828;">この化合物は「${data.risk_assessment.regulation}」に指定されています。</p>`;
                            html += `<p style="margin: 8px 0; color: #666; font-size: 0.9em;">法令に基づくラベル表示・SDS交付等が義務付けられます。</p>`;
                            html += `</div>`;
                        }

                        // 化合物情報を表示
                        if (data.compound_info) {
                            html += `<hr>`;
                            if (data.compound_info.source === 'cas') {
                                html += `<p><strong>検出方法: CAS番号から取得</strong></p>`;
                                html += `<p><strong>CAS番号:</strong> ${data.cas_number}</p>`;
                            } else if (data.compound_info.source === 'name') {
                                html += `<p><strong>検出方法: 化合物名から取得</strong></p>`;
                                if (data.compound_info.cas !== 'N/A') {
                                    html += `<p><strong>CAS番号:</strong> ${data.compound_info.cas}</p>`;
                                }
                            }
                            html += `<p><strong>化合物名:</strong> ${data.compound_info.name}</p>`;
                            if (data.compound_info.common_name) {
                                html += `<p><strong>通称名:</strong> ${data.compound_info.common_name}</p>`;
                            }
                            html += `<p><strong>分子式:</strong> ${data.compound_info.formula}</p>`;
                            html += `<p><strong>分子量:</strong> ${data.compound_info.weight}</p>`;

                            currentCompoundInfo = {
                                ...data.compound_info,
                                commonName: data.compound_info.common_name || '',
                                riskAssessment: data.risk_assessment || null
                            };
                            addToListContainer.style.display = 'block';
                        } else {
                            currentCompoundInfo = null;
                            addToListContainer.style.display = 'none';
                        }

                        ocrResults.innerHTML = html || '<p>テキストが検出されませんでした</p>';
                        previousTexts = data.texts;
                        console.log('[performOCR] Display updated');
                    } else {
                        console.log('[performOCR] Text unchanged, skipping display update');
                    }
                }
                console.log('[performOCR] Completed successfully');
            } catch (error) {
                console.error('[performOCR] Exception caught:', error.message, error.stack);
                if (myGeneration === scanGeneration) {
                    ocrResults.innerHTML = `<p class="error">エラー: ${error.message}</p>`;
                }
            } finally {
                // 必ずフラグを下ろす（成功時・エラー時の両方）
                isOCRProcessing = false;
                console.log('[performOCR] Processing flag cleared');
            }
        }

        // ボタンクリックで開始/停止
        captureBtn.addEventListener('click', () => {
            if (isRunning) {
                // 停止（常に即座に実行）
                scanGeneration++;  // 進行中のOCR結果を無効化（古い世代として破棄）
                clearInterval(intervalId);
                clearInterval(countdownInterval);
                shouldStop = true; // 停止フラグを立てる
                isRunning = false;
                captureBtn.textContent = '自動スキャン: 開始';
                statusEl.textContent = '停止しました';
                console.log('[Button Click] Stop button pressed - system stopped, generation now', scanGeneration);
            } else {
                // 開始
                scanGeneration++;  // 新しいセッション。古い世代の結果は無効化される
                shouldStop = false; // 停止フラグを下ろす
                isRunning = true;
                captureBtn.textContent = '自動スキャン: 停止';
                console.log('[Button Click] Start button pressed, generation now', scanGeneration);

                // カウントダウン処理
                let countdown = startupDelay;
                statusEl.textContent = countdown + '秒後に開始...';

                countdownInterval = setInterval(() => {
                    countdown--;
                    if (countdown > 0) {
                        statusEl.textContent = countdown + '秒後に開始...';
                    } else {
                        clearInterval(countdownInterval);
                        console.log('[Countdown Complete] isRunning:', isRunning, 'shouldStop:', shouldStop);
                        if (isRunning) {
                            statusEl.textContent = '実行中...';
                            shouldStop = false;
                            previousTexts = [];  // 新規スキャン時にテキスト履歴をリセット
                            console.log('[Starting OCR] About to call performOCR, flags set to isRunning=true, shouldStop=false, previousTexts cleared');

                            // 初回は即座に実行（setTimeoutなし）
                            try {
                                performOCR().catch(err => {
                                    console.error('[OCR Error] Initial scan failed:', err);
                                });
                            } catch (err) {
                                console.error('[OCR Exception] Initial scan threw exception:', err);
                            }

                            // スキャン間隔（秒）で実行
                            if (intervalId) {
                                console.log('[Cleanup] Clearing previous intervalId');
                                clearInterval(intervalId);
                            }
                            intervalId = setInterval(() => {
                                if (isRunning && !shouldStop) {
                                    console.log('[Periodic OCR] Executing scan at interval');
                                    try {
                                        performOCR().catch(err => {
                                            console.error('[OCR Error] Periodic scan failed:', err);
                                        });
                                    } catch (err) {
                                        console.error('[OCR Exception] Periodic scan threw exception:', err);
                                    }
                                }
                            }, scanInterval * 1000);
                            console.log('[Interval Set] Scanning will repeat every', scanInterval, 'seconds');
                        }
                    }
                }, 1000);
            }
        });

    </script>
</body>
</html>
