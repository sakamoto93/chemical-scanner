<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chemical Scanner</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Chemical Scanner</h1>
        <div class="camera-container">
            <img id="camera" src="/video_feed" alt="Camera Feed">
            <canvas id="canvas" style="display:none;"></canvas>
        </div>
        <div class="controls">
            <button id="capture-btn">自動スキャン: 開始</button>
            <span id="status"></span>
        </div>
        <div class="settings">
            <h3>スキャン設定</h3>
            <div class="setting-group">
                <label for="startup-delay">スタートアップ遅延（秒）:</label>
                <input type="number" id="startup-delay" value="5" min="1" max="60" step="0.5">
            </div>
            <div class="setting-group">
                <label for="scan-interval">スキャン間隔（秒）:</label>
                <input type="number" id="scan-interval" value="3.5" min="0.5" max="30" step="0.5">
            </div>
        </div>
        <div class="results">
            <h2>OCR結果</h2>
            <div id="ocr-results"></div>
            <div id="add-to-list-container" style="display:none; margin-top: 15px;">
                <button id="add-to-list-btn">リストに追加</button>
            </div>
        </div>
        <div class="compound-list">
            <h2>検出された試薬一覧</h2>
            <table id="compound-table">
                <thead>
                    <tr>
                        <th>CAS番号</th>
                        <th>化合物名</th>
                        <th>分子式</th>
                        <th>分子量</th>
                        <th>削除</th>
                    </tr>
                </thead>
                <tbody id="compound-tbody">
                </tbody>
            </table>
            <p id="empty-message" style="text-align: center; color: #999; padding: 20px;">
                リストに試薬を追加してください
            </p>
        </div>
    </div>
    <script>
        const captureBtn = document.getElementById('capture-btn');
        const statusEl = document.getElementById('status');
        const ocrResults = document.getElementById('ocr-results');
        const startupDelayInput = document.getElementById('startup-delay');
        const scanIntervalInput = document.getElementById('scan-interval');
        const addToListBtn = document.getElementById('add-to-list-btn');
        const addToListContainer = document.getElementById('add-to-list-container');
        const compoundTbody = document.getElementById('compound-tbody');
        const emptyMessage = document.getElementById('empty-message');

        let isRunning = false;
        let intervalId = null;
        let countdownInterval = null;
        let previousTexts = [];
        let shouldStop = false;
        let startupDelay = 5;
        let scanInterval = 3.5;
        let currentCompoundInfo = null;
        let compoundList = [];

        // 設定変更時のイベントリスナー
        startupDelayInput.addEventListener('change', () => {
            startupDelay = parseFloat(startupDelayInput.value);
        });

        scanIntervalInput.addEventListener('change', () => {
            scanInterval = parseFloat(scanIntervalInput.value);
        });

        // リスト追加ボタンのイベントリスナー
        addToListBtn.addEventListener('click', addToList);

        // テキスト配列をJSON文字列に変換（比較用）
        function textsToString(texts) {
            return JSON.stringify(texts.map(item => item.text));
        }

        // リストにアイテムを追加
        function addToList() {
            if (!currentCompoundInfo) {
                alert('追加する化合物情報がありません');
                return;
            }

            const item = {
                cas: currentCompoundInfo.cas || 'N/A',
                name: currentCompoundInfo.name,
                commonName: currentCompoundInfo.commonName || '',
                formula: currentCompoundInfo.formula,
                weight: currentCompoundInfo.weight
            };

            compoundList.push(item);
            updateCompoundTable();

            // リスト追加後にOCR結果をクリアしてスムーズに次のスキャンに進む
            ocrResults.innerHTML = '<p>次の試薬を読み取り中...</p>';
            currentCompoundInfo = null;
            addToListContainer.style.display = 'none';
            previousTexts = [];
        }

        // テーブルを更新（差分更新による高速化）
        function updateCompoundTable() {
            if (compoundList.length === 0) {
                compoundTbody.innerHTML = '';
                emptyMessage.style.display = 'block';
            } else {
                emptyMessage.style.display = 'none';
                // 現在の行数と比較して、不足分のみ追加
                const currentRows = compoundTbody.querySelectorAll('tr').length;
                const itemsToAdd = compoundList.slice(currentRows);

                if (currentRows === 0) {
                    // 最初の追加時は全行作成
                    itemsToAdd.forEach((item, index) => {
                        const row = document.createElement('tr');
                        const displayName = item.commonName ? `${item.name}<br/><small>(${item.commonName})</small>` : item.name;
                        row.innerHTML = `
                            <td>${item.cas}</td>
                            <td>${displayName}</td>
                            <td>${item.formula}</td>
                            <td>${item.weight}</td>
                            <td><button class="delete-btn" onclick="deleteFromList(${index})">削除</button></td>
                        `;
                        compoundTbody.appendChild(row);
                    });
                } else {
                    // 新しい行のみ追加（差分更新）
                    itemsToAdd.forEach((item, offset) => {
                        const index = currentRows + offset;
                        const row = document.createElement('tr');
                        const displayName = item.commonName ? `${item.name}<br/><small>(${item.commonName})</small>` : item.name;
                        row.innerHTML = `
                            <td>${item.cas}</td>
                            <td>${displayName}</td>
                            <td>${item.formula}</td>
                            <td>${item.weight}</td>
                            <td><button class="delete-btn" onclick="deleteFromList(${index})">削除</button></td>
                        `;
                        compoundTbody.appendChild(row);
                    });
                }
            }
        }

        // リストから削除
        function deleteFromList(index) {
            compoundList.splice(index, 1);
            // 削除後は全行を再構築（インデックス正確性を保証）
            compoundTbody.innerHTML = '';
            if (compoundList.length === 0) {
                emptyMessage.style.display = 'block';
            } else {
                emptyMessage.style.display = 'none';
                compoundList.forEach((item, idx) => {
                    const row = document.createElement('tr');
                    const displayName = item.commonName ? `${item.name}<br/><small>(${item.commonName})</small>` : item.name;
                    row.innerHTML = `
                        <td>${item.cas}</td>
                        <td>${displayName}</td>
                        <td>${item.formula}</td>
                        <td>${item.weight}</td>
                        <td><button class="delete-btn" onclick="deleteFromList(${idx})">削除</button></td>
                    `;
                    compoundTbody.appendChild(row);
                });
            }
        }

        // OCR実行関数
        async function performOCR() {
            // 停止フラグが立っている場合は実行しない
            if (shouldStop) {
                console.log('[performOCR] Skipped: shouldStop is true');
                return;
            }

            console.log('[performOCR] Starting capture request');
            try {
                const captureStart = performance.now();
                const response = await fetch('/capture');
                const captureEnd = performance.now();
                console.log('[performOCR] Capture response received in', (captureEnd - captureStart).toFixed(2), 'ms, status:', response.status);

                if (!response.ok) {
                    throw new Error(`Capture failed with status ${response.status}`);
                }

                const blob = await response.blob();
                console.log('[performOCR] Blob received, size:', blob.size, 'bytes');

                const formData = new FormData();
                formData.append('file', blob, 'frame.jpg');

                console.log('[performOCR] Starting OCR request');
                const ocrStart = performance.now();
                const ocrResponse = await fetch('/ocr', {
                    method: 'POST',
                    body: formData
                });
                const ocrEnd = performance.now();
                console.log('[performOCR] OCR response received in', (ocrEnd - ocrStart).toFixed(2), 'ms, status:', ocrResponse.status);

                if (!ocrResponse.ok) {
                    throw new Error(`OCR failed with status ${ocrResponse.status}`);
                }

                const data = await ocrResponse.json();
                console.log('[performOCR] OCR data parsed, texts count:', data.texts ? data.texts.length : 0);

                // 停止中に処理が完了した場合は表示しない
                if (shouldStop) {
                    console.log('[performOCR] Processing cancelled: shouldStop is true');
                    return;
                }

                if (data.error) {
                    console.error('[performOCR] Server error:', data.error);
                    ocrResults.innerHTML = `<p class="error">エラー: ${data.error}</p>`;
                    previousTexts = [];
                } else {
                    // 現在のテキストと前フレームを比較
                    const currentTextsStr = textsToString(data.texts);
                    const previousTextsStr = textsToString(previousTexts);
                    console.log('[performOCR] Text comparison - current:', currentTextsStr.substring(0, 50), '... | previous:', previousTextsStr.substring(0, 50), '...');

                    // テキストが異なる場合のみ表示を更新
                    if (currentTextsStr !== previousTextsStr) {
                        console.log('[performOCR] New text detected, updating display');
                        let html = '';

                        // OCRで抽出したテキストを表示
                        data.texts.forEach(item => {
                            html += `<p><strong>${item.text}</strong> (信頼度: ${(item.confidence * 100).toFixed(1)}%)</p>`;
                        });

                        // 化合物情報を表示
                        if (data.compound_info) {
                            html += `<hr>`;
                            if (data.compound_info.source === 'cas') {
                                html += `<p><strong>検出方法: CAS番号から取得</strong></p>`;
                                html += `<p><strong>CAS番号:</strong> ${data.cas_number}</p>`;
                            } else if (data.compound_info.source === 'name') {
                                html += `<p><strong>検出方法: 化合物名から取得</strong></p>`;
                                if (data.compound_info.cas !== 'N/A') {
                                    html += `<p><strong>CAS番号:</strong> ${data.compound_info.cas}</p>`;
                                }
                            }
                            html += `<p><strong>化合物名:</strong> ${data.compound_info.name}</p>`;
                            if (data.compound_info.common_name) {
                                html += `<p><strong>通称名:</strong> ${data.compound_info.common_name}</p>`;
                            }
                            html += `<p><strong>分子式:</strong> ${data.compound_info.formula}</p>`;
                            html += `<p><strong>分子量:</strong> ${data.compound_info.weight}</p>`;

                            currentCompoundInfo = {
                                ...data.compound_info,
                                commonName: data.compound_info.common_name || ''
                            };
                            addToListContainer.style.display = 'block';
                        } else {
                            currentCompoundInfo = null;
                            addToListContainer.style.display = 'none';
                        }

                        ocrResults.innerHTML = html || '<p>テキストが検出されませんでした</p>';
                        previousTexts = data.texts;
                        console.log('[performOCR] Display updated');
                    } else {
                        console.log('[performOCR] Text unchanged, skipping display update');
                    }
                }
                console.log('[performOCR] Completed successfully');
            } catch (error) {
                console.error('[performOCR] Exception caught:', error.message, error.stack);
                ocrResults.innerHTML = `<p class="error">エラー: ${error.message}</p>`;
            }
        }

        // ボタンクリックで開始/停止
        captureBtn.addEventListener('click', () => {
            if (isRunning) {
                // 停止
                clearInterval(intervalId);
                clearInterval(countdownInterval);
                shouldStop = true; // 停止フラグを立てる
                isRunning = false;
                captureBtn.textContent = '自動スキャン: 開始';
                statusEl.textContent = '停止中';
            } else {
                // 開始
                shouldStop = false; // 停止フラグを下ろす
                isRunning = true;
                captureBtn.textContent = '自動スキャン: 停止';

                // カウントダウン処理
                let countdown = startupDelay;
                statusEl.textContent = countdown + '秒後に開始...';

                countdownInterval = setInterval(() => {
                    countdown--;
                    if (countdown > 0) {
                        statusEl.textContent = countdown + '秒後に開始...';
                    } else {
                        clearInterval(countdownInterval);
                        console.log('[Countdown Complete] isRunning:', isRunning, 'shouldStop:', shouldStop);
                        if (isRunning) {
                            statusEl.textContent = '実行中...';
                            shouldStop = false;
                            console.log('[Starting OCR] About to call performOCR, flags set to isRunning=true, shouldStop=false');

                            // 初回は即座に実行（setTimeoutなし）
                            try {
                                performOCR().catch(err => {
                                    console.error('[OCR Error] Initial scan failed:', err);
                                });
                            } catch (err) {
                                console.error('[OCR Exception] Initial scan threw exception:', err);
                            }

                            // スキャン間隔（秒）で実行
                            if (intervalId) {
                                console.log('[Cleanup] Clearing previous intervalId');
                                clearInterval(intervalId);
                            }
                            intervalId = setInterval(() => {
                                if (isRunning && !shouldStop) {
                                    console.log('[Periodic OCR] Executing scan at interval');
                                    try {
                                        performOCR().catch(err => {
                                            console.error('[OCR Error] Periodic scan failed:', err);
                                        });
                                    } catch (err) {
                                        console.error('[OCR Exception] Periodic scan threw exception:', err);
                                    }
                                }
                            }, scanInterval * 1000);
                            console.log('[Interval Set] Scanning will repeat every', scanInterval, 'seconds');
                        }
                    }
                }, 1000);
            }
        });

    </script>
</body>
</html>
