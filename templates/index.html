<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chemical Scanner</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Chemical Scanner</h1>
        <div class="camera-container">
            <img id="camera" src="/video_feed" alt="Camera Feed">
            <canvas id="canvas" style="display:none;"></canvas>
        </div>
        <div class="controls">
            <button id="capture-btn">自動スキャン: 開始</button>
            <span id="status"></span>
        </div>
        <div class="settings">
            <h3>スキャン設定</h3>
            <div class="setting-group">
                <label for="startup-delay">スタートアップ遅延（秒）:</label>
                <input type="number" id="startup-delay" value="5" min="1" max="60" step="0.5">
            </div>
            <div class="setting-group">
                <label for="scan-interval">スキャン間隔（秒）:</label>
                <input type="number" id="scan-interval" value="2.5" min="0.5" max="30" step="0.5">
            </div>
        </div>
        <div class="results">
            <h2>OCR結果</h2>
            <div id="ocr-results"></div>
        </div>
    </div>
    <script>
        const captureBtn = document.getElementById('capture-btn');
        const statusEl = document.getElementById('status');
        const ocrResults = document.getElementById('ocr-results');
        const startupDelayInput = document.getElementById('startup-delay');
        const scanIntervalInput = document.getElementById('scan-interval');

        let isRunning = false;
        let intervalId = null;
        let countdownInterval = null;
        let previousTexts = [];
        let shouldStop = false;
        let startupDelay = 5;
        let scanInterval = 2.5;

        // 設定変更時のイベントリスナー
        startupDelayInput.addEventListener('change', () => {
            startupDelay = parseFloat(startupDelayInput.value);
        });

        scanIntervalInput.addEventListener('change', () => {
            scanInterval = parseFloat(scanIntervalInput.value);
        });

        // テキスト配列をJSON文字列に変換（比較用）
        function textsToString(texts) {
            return JSON.stringify(texts.map(item => item.text));
        }

        // OCR実行関数
        async function performOCR() {
            // 停止フラグが立っている場合は実行しない
            if (shouldStop) {
                return;
            }

            try {
                const response = await fetch('/capture');
                const blob = await response.blob();

                const formData = new FormData();
                formData.append('file', blob, 'frame.jpg');

                const ocrResponse = await fetch('/ocr', {
                    method: 'POST',
                    body: formData
                });

                const data = await ocrResponse.json();

                // 停止中に処理が完了した場合は表示しない
                if (shouldStop) {
                    return;
                }

                if (data.error) {
                    ocrResults.innerHTML = `<p class="error">エラー: ${data.error}</p>`;
                    previousTexts = [];
                } else {
                    // 現在のテキストと前フレームを比較
                    const currentTextsStr = textsToString(data.texts);
                    const previousTextsStr = textsToString(previousTexts);

                    // テキストが異なる場合のみ表示を更新
                    if (currentTextsStr !== previousTextsStr) {
                        let html = '';

                        // OCRで抽出したテキストを表示
                        data.texts.forEach(item => {
                            html += `<p><strong>${item.text}</strong> (信頼度: ${(item.confidence * 100).toFixed(1)}%)</p>`;
                        });

                        // CAS番号と化合物情報を表示
                        if (data.cas_number) {
                            html += `<hr><p><strong>検出CAS番号:</strong> ${data.cas_number}</p>`;
                            if (data.compound_info) {
                                html += `<p><strong>化合物名:</strong> ${data.compound_info.name}</p>`;
                                html += `<p><strong>分子式:</strong> ${data.compound_info.formula}</p>`;
                                html += `<p><strong>分子量:</strong> ${data.compound_info.weight}</p>`;
                            } else {
                                html += `<p><em>化合物情報が見つかりません</em></p>`;
                            }
                        }

                        ocrResults.innerHTML = html || '<p>テキストが検出されませんでした</p>';
                        previousTexts = data.texts;
                    }
                }
            } catch (error) {
                ocrResults.innerHTML = `<p class="error">エラー: ${error.message}</p>`;
            }
        }

        // ボタンクリックで開始/停止
        captureBtn.addEventListener('click', () => {
            if (isRunning) {
                // 停止
                clearInterval(intervalId);
                clearInterval(countdownInterval);
                shouldStop = true; // 停止フラグを立てる
                isRunning = false;
                captureBtn.textContent = '自動スキャン: 開始';
                statusEl.textContent = '停止中';
            } else {
                // 開始
                shouldStop = false; // 停止フラグを下ろす
                isRunning = true;
                captureBtn.textContent = '自動スキャン: 停止';

                // カウントダウン処理
                let countdown = startupDelay;
                statusEl.textContent = countdown + '秒後に開始...';

                countdownInterval = setInterval(() => {
                    countdown--;
                    if (countdown > 0) {
                        statusEl.textContent = countdown + '秒後に開始...';
                    } else {
                        clearInterval(countdownInterval);
                        if (isRunning) {
                            statusEl.textContent = '実行中...';
                            // 初回は即座に実行
                            performOCR();

                            // スキャン間隔（秒）で実行
                            intervalId = setInterval(performOCR, scanInterval * 1000);
                        }
                    }
                }, 1000);
            }
        });

    </script>
</body>
</html>
